<main class="identity-page">
  <section class="identity-card" aria-labelledby="reset-title">
    <header class="identity-brand">
      <img src="assets/brand-shield.svg" alt="" />
      <p class="eyebrow">Logística</p>
      <p class="identity-brand__name">Almacenamiento</p>
      <p class="identity-brand__copy">Crea una nueva contraseña para tu cuenta</p>
    </header>

    <h1 id="reset-title">Restablecer contraseña</h1>
    <form class="identity-form" (ngSubmit)="submit()" #resetForm="ngForm">
      <label class="identity-field">Nueva contraseña
        <input name="password" type="password" autocomplete="new-password" required
          minlength="10" maxlength="128" [(ngModel)]="password" />
      </label>
      <label class="identity-field">Confirmar contraseña
        <input name="confirmPassword" type="password" autocomplete="new-password" required
          minlength="10" maxlength="128" [(ngModel)]="confirmPassword" />
      </label>
      <p class="identity-copy">Mínimo 10 caracteres, con letras y números.</p>

      @if (error()) {
        <p class="identity-notice" role="alert">{{ error() }}</p>
      }
      @if (success()) {
        <p class="identity-notice identity-notice--success" role="status">{{ success() }}</p>
      }

      @if (!success()) {
        <button class="identity-primary" type="submit"
          [disabled]="resetForm.invalid || loading() || !token">
          {{ loading() ? 'Guardando…' : 'Guardar contraseña' }}
        </button>
      }
    </form>

    <footer class="identity-links">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </footer>
  </section>
</main>
